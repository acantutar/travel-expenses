name: Validate TripSplit frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check app.js
      - name: TripSplit v4 wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          js = Path("app.js").read_text()
          refs = set(re.findall(r'\$\("([\w-]+)"\)', js))
          ids = set(re.findall(r'id="([\w-]+)"', html))
          assert not (refs - ids), f"Missing HTML elements: {refs - ids}"
          assert "app.js?v=4.3" in html
          assert "styles.css?v=4.3" in html
          for key in ("create_trip", "create_trip_expense", "create_trip_settlement",
                      "trip_members", "trip_display_rates", "tripSelect", "set_trip_member_active",
                      "join-register", "create_trip_invite", "preview_trip_invite",
                      "redeem_trip_invite", "create_trip_with_settings", "set_trip_currency_rate",
                      "newTripBaseCurrency", "tripAllowedCurrencyChoices",
                      "loadCurrencyCatalog", "loadPersonalCurrencyFavorites",
                      "user_currency_favorites", "changeOwnPassword"):
              assert key in (js + html), key
          assert len(ids) == len(re.findall(r'id="([\w-]+)"', html)), "Duplicate HTML ids"
          assert "SERVICE_ROLE_KEY" not in js, "Server credentials must not be in frontend"
          assert "newTripCurrencyChoices" in html
          assert "inviteAcceptance" in html
          assert "joinRegisterForm" in html
          assert "Admin İşlemleri" not in html
          assert "accountTripCount" in html
          assert "favoriteCurrencySearch" in html
          assert "favoriteCurrencyResults" in html
          assert "selfPasswordForm" in html
          assert "trip-header-clean" in html
          assert "currency-more-toggle" in js
          assert "currency-extra-panel" in js
          assert "favoriteCurrencySelect" not in (html + js)
          import json
          match = re.search(r"const RECOMMENDED_CURRENCIES = (\[[^\]]+\])", js)
          assert match, "Missing recommended currencies"
          items = json.loads(match.group(1))
          assert len(items) == 10 and len(set(items)) == 10, items
          assert html.index("tripMembersPanel") < html.index("selfPasswordForm")
          assert html.count('id="newTripCurrencyChoices"') == 1
          sql=Path("migrations/v4_multitrip.sql").read_text()
          assert "enable row level security" in sql
          print("TripSplit v4.3 static checks passed")
          PY
      - name: Install browser layout test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.1
      - name: Responsive UI layout (375 / 768 / 1440)
        env:
          UI_SCREENSHOTS: "1"
        run: node tests/ui-layout-smoke.mjs
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripsplit-ui-smoke
          path: ui-screenshots/
          if-no-files-found: ignore
